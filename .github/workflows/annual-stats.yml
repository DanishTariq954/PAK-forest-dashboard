name: Annual Hansen Stats Refresh

on:
  schedule:
    - cron: "0 6 1 2 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  annual-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run annual stats update
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/update_annual_stats.py

      - name: Run map layers export
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/update_map_layers.py

      - name: Commit updated annual data and map layers
        run: |
          git config user.name "forest-watch-bot"
          git config user.email "actions@github.com"
          git add docs/data/annual_stats.json docs/data/layer_treecover2000.png docs/data/layer_treecover_current.png docs/data/layer_loss.png docs/data/map_layers_bounds.json
          git diff --quiet --cached || git commit -m "Annual stats + map layers refresh: $(date -u +'%Y-%m-%d')"
          git push
